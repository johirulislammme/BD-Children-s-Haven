<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — BD Children's Haven</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Nunito',sans-serif;background:#2f4258;color:#243858;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:#fff;padding:36px 32px;border-radius:20px;width:320px;box-shadow:0 20px 40px rgba(0,0,0,0.25);}
  h1{font-family:'Baloo 2';font-size:22px;margin:0 0 20px;text-align:center;}
  label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;}
  input{width:100%;padding:11px 12px;margin-bottom:14px;border-radius:10px;border:2px solid #eee0c4;font-family:'Nunito';font-size:14px;}
  button{width:100%;padding:12px;border:none;border-radius:999px;background:#ef6461;color:#fff;font-family:'Baloo 2';font-weight:700;font-size:15px;cursor:pointer;}
  #err{color:#d6504d;font-size:13px;text-align:center;margin-top:10px;display:none;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>🧸 Admin Login</h1>
    <label>Username</label><input type="text" id="u" required>
    <label>Password</label><input type="password" id="p" required>
    <button type="submit">Log in</button>
    <p id="err">Wrong username or password.</p>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/admin/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      if (res.ok) window.location.href = '/admin/dashboard.html';
      else document.getElementById('err').style.display = 'block';
    });
  </script>
</body>
</html>
