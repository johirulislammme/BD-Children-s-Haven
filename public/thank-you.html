<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order received — BD Children's Haven</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Nunito',sans-serif;background:#fdf6ea;color:#243858;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
  .box{max-width:420px;}
  .emoji{font-size:64px;}
  h1{font-family:'Baloo 2';font-size:28px;margin:10px 0;}
  p{color:#5c6a80;font-size:15px;}
  a.btn{display:inline-block;margin-top:18px;background:#ef6461;color:#fff;font-family:'Baloo 2';font-weight:700;padding:12px 26px;border-radius:999px;text-decoration:none;}
  #trxid{font-size:12.5px;color:#8a97a8;}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji" id="emoji">🎉</div>
    <h1 id="heading">Thank you for your order!</h1>
    <p id="msg">We've received your order and will confirm it shortly.</p>
    <p id="trxid"></p>
    <a class="btn" href="/">Continue Shopping</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const tran = params.get('tran_id');
    if (status === 'failed'){
      document.getElementById('emoji').textContent = '😕';
      document.getElementById('heading').textContent = 'Payment failed';
      document.getElementById('msg').textContent = 'Your payment could not be completed. Please try again or choose Cash on Delivery.';
    } else if (status === 'cancelled'){
      document.getElementById('emoji').textContent = '↩️';
      document.getElementById('heading').textContent = 'Payment cancelled';
      document.getElementById('msg').textContent = 'You cancelled the payment. Your cart items are safe — you can try checking out again.';
    }
    if (tran) document.getElementById('trxid').textContent = 'Order reference: ' + tran;
  </script>
</body>
</html>
